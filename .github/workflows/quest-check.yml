name: quest-check

on:
  pull_request:
    branches: [main]

jobs:
  quest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Проверяем сам head ветки, а не временный merge-коммит GitHub
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Проверить этап квеста
        run: bash tools/check.sh
